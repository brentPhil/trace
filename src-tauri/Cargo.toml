[package]
name = "chroneli-desktop"
version = "0.1.0"
description = "Chroneli desktop shell"
edition = "2021"

[lib]
name = "chroneli_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `std` so that `getrandom::Error` implements `std::error::Error` and can be
# returned from `BeginError::source()` — without it the entropy failure's cause
# chain dead-ends at this crate. No cost here: it is a desktop binary that
# already links std.
getrandom = { version = "0.3", features = ["std"] }

# Close hides to tray and Quit lives only in the tray menu, so a user who has
# lost the tray icon in Windows 11's overflow flyout will relaunch the exe —
# and without this get a second webview, a second tray icon and a second
# ticker thread. Desktop only: mobile has no second launch to guard against,
# and the plugin does not build there. It registers no IPC commands, so it
# widens nothing in capabilities/default.json.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
