<?xml version="1.0" encoding="UTF-8"?>
<!--
  The app icon: the wordmark's initial, drawn as a geometric C on a white tile.

  A stroked arc rather than a glyph from a font, so the icon script renders it
  identically on any machine — librsvg draws text with whatever fonts the
  system has, and a CI box has none of ours. The tile is the ground the OS
  needs (see scripts/make-icons.mjs); the ink is the same near-black the
  previous mark used.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#fff"/>
  <path d="M365.98 156.97 A148 148 0 1 0 365.98 355.03" fill="none" stroke="#231f20" stroke-width="60" stroke-linecap="round"/>
</svg>
